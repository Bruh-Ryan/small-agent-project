name: Java CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JSON library
        run: curl -sL -o json-20240303.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Compile
        run: javac -cp json-20240303.jar wikipediaAgent.java

      - name: Run
        run: java -cp json-20240303.jar:. wikipediaAgent "What is a black hole?"

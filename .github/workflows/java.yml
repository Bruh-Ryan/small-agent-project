name: Java CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JSON library
        run: curl -sL -o json-20240303.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar

      - name: Compile agent
        run: javac -cp json-20240303.jar wikipediaAgent.java

      - name: Compile tests
        run: javac -cp json-20240303.jar:. wikipediaAgentTest.java

      - name: Run unit tests
        run: java -cp json-20240303.jar:. wikipediaAgentTest

      - name: Smoke test (live run)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: java -cp json-20240303.jar:. wikipediaAgent "What is a black hole?"

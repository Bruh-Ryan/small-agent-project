name: Secret scan

# Scans the CHECKED-OUT FILES for credential patterns. Deliberately NOT a
# history scan: .env was committed once in 3e2921f and later deleted, so a full
# --log-opts history scan would keep failing on that old, already-rotated key
# forever. This job's job is to stop the next one.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the download URL below.
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --source . --redact --verbose --exit-code 1
